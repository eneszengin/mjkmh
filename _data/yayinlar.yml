  image_credit: "Şekil 1, CC BY 4.0"

- year: 2026
  date: "2026-05-08"
  title: "Excavation-induced stress release and ground improvement depth in normally consolidated rock, transitional rock, and soil media"
  authors:
    - {n: "Bozkurtoğlu E.", m: true}
  source: "Bulletin of Engineering Geology and the Environment"
  type: Makale
  quartile: "(Q1 - Scopus)"
  doi: "10.1007/s10064-026-05010-1"
  abstract: "Excavation-induced stress-release governs the mechanical response of geomaterials and may influence ground deformation and foundation performance beneath excavation bases. Although the concept of normal consolidation is commonly associated with soils, stress-states governed primarily by present overburden conditions may also occur in transitional rock and rock masses. This study presents a simplified analytical framework for evaluating excavation-induced stress redistribution and for defining preliminary ground-improvement depth envelopes in normally consolidated geomaterials. The proposed formulation is based on a one-dimensional reference stress framework governed by self-weight and reformulates the overconsolidation ratio (OCR) to represent excavation-induced stress-release as a normalized indicator of unloading. Within this framework, the depth at which the normalized OCR approaches unity is expressed as a function of excavation depth, defining an asymptotic analytical limit associated with the attenuation of excavation-induced stress redistribution. For normally consolidated soils, this limiting depth is approximately proportional to excavation depth (≈ 201·ED), which should be interpreted as a theoretical upper-bound envelope rather than a physically mobilized disturbance depth. The analytical framework is used to derive preliminary expressions for estimating ground-improvement depth in soils and to define ratio-based influence envelopes for transitional rock and rock environments. The proposed relationships are intended as screening-level engineering indicators that translate excavation depth and structural importance into rational ranges of ground-improvement depth. Although real excavation behaviour is governed by complex three-dimensional processes, recognition of such asymptotic stress-release envelopes may provide useful insight into the potential extent of excavation influence zone and support preliminary design assessment."
  image: bozkurtoglu-2026-kazi.jpg
  image_credit: "Şekil 6, CC BY 4.0"

- year: 2026
  date: "2026-05-04"
  title: "GIS-Based Evaluation of Green Space Accessibility (GSA) in Earthquake-Prone Urban Areas: a Case Study of Istanbul, Türkiye"
  authors:
    - {n: "Zengin E.", m: true}
  source: "Remote Sensing in Earth Systems Sciences"
  type: Makale
  quartile: "(Q1 - Scopus)"
  doi: "10.1007/s41976-026-00287-y"
  abstract: "Istanbul, situated in one of the world’s most seismically active regions, faces urgent challenges in disaster preparedness due to its dense urban environment and large population. Urban green spaces are vital for enhancing disaster resilience, serving as essential evacuation zones, emergency shelters, and relief hubs. This study highlights the critical importance of accessible green spaces on the Anatolian side of Istanbul, using advanced GIS tools to evaluate their accessibility, size, and distribution. The findings expose stark spatial disparities among neighborhoods: while 53% of residents are within a five-minute walk of green spaces, this number rises to only 84% at ten minutes and 90% at fifteen minutes, leaving approximately 9% of the population beyond a fifteen-minute walk—an urgent gap that must be addressed. These results compellingly demonstrate the need for targeted urban planning strategies to expand green spaces in underserved areas, integrating disaster resilience into the core of urban development."

- year: 2026
  date: "2026-04-11"
  title: "Fractal Analysis of Thermally Induced Damage in Volcanic Rocks: Linking Mechanical Behavior and Mineralogical Controls"
  authors:
    - {n: "Dinç Göğüş Ö.", m: true}
    - {n: "Zengin E.", m: true}
    - {n: "Korkut M.", m: true}
    - {n: "Doğu M.M.", m: true}
    - {n: "Avcıoğlu M."}
    - {n: "Ündül Ö.", m: true}
    - {n: "Çiftçi E."}
  source: "Fractal and Fractional"
  type: Makale
  doi: "10.3390/fractalfract10040250"
  abstract: "Moderate thermal exposure can significantly influence the mechanical behavior of volcanic rocks by inducing microcrack development and altering crack network characteristics. However, quantifying such damage processes remains challenging when relying solely on conventional mechanical parameters. In this study, the evolution of crack network complexity in andesite and andesitic–basaltic rocks subjected to moderate thermal exposure (200 °C) is investigated using fractal analysis integrated with mechanical and mineralogical observations. Six core specimens were tested under uniaxial compression, including three natural specimens and three specimens thermally treated at 200 °C prior to loading. After failure, crack surfaces were digitized and fractal dimensions (D) were calculated using the box-counting method. Petrographic observations and X-ray powder diffraction (XRPD) analyses were conducted to characterize the mineralogical composition and microstructural features controlling crack development. The results indicate that thermal exposure primarily reduces rock stiffness rather than peak strength. While the uniaxial compressive strength (UCS) of two specimens remains nearly unchanged after heating, the elastic modulus (E) decreases in all thermally treated specimens. Mineralogical observations reveal a heterogeneous volcanic fabric dominated by plagioclase and pyroxene within a fine-grained groundmass, with secondary calcite phases occurring in veins and pocket fillings. Fractal analysis shows generally lower D values in thermally treated specimens, suggesting crack redistribution and coalescence rather than increased network complexity, consistent with the observed reduction in stiffness and a tendency toward more ductile deformation behavior."
  image: dinc-gogus-2026-fraktal.jpg
  image_credit: "Şekil 5, CC BY 4.0"

- year: 2026
  date: "2026-03-23"
  title: "Bakırköy Küfeki Stone: A Heritage Stone Nominee with regards to the UNESCO World Heritage Site of Istanbul, Türkiye"
  authors:
    - {n: "Angı O.S."}
    - {n: "Mahmutoğlu Y.", m: true}
    - {n: "Çiftçi E."}
    - {n: "Akyüz H.S."}
  source: "Geoheritage"
  type: Makale
  quartile: "(Q1 - Scopus)"
  doi: "10.1007/s12371-026-01293-8"
  abstract: "Natural stone not only endures; it records cultural memory. Bakırköy Küfeki Stone, a Miocene biosparitic limestone, historically quarried near present-day Bakırköy where is a district in Istanbul, and as the relevant lithology is most commonly found within the boundaries of this district, the stone has been named accordingly underpinned the architectural fabric of Istanbul’s Historical Peninsula (UNESCO World Heritage Site), spanning the Roman and Ottoman eras (e.g. city walls, aqueducts, major churches and mosques). Rapid urbanization has removed access to the original quarries. As a result, recent restorations have often substituted lithologies that mimic color/texture but differ in provenance and engineering behavior, which may hasten decay and compromise authenticity. This study assesses Bakırköy Küfeki Stone as a Global Heritage Stone Resource (GHSR) nominee by documenting its historical use, quarry distribution, geological context, and by characterizing mineralogical–petrographic, geochemical, and physico-mechanical characteristics (XRPD, WD-XRF, density, water absorption, porosity, uniaxial compressive, tensile, and abrasion strengths, frost resistance). Findings indicate a calcite-dominated, porous stone that is workable when freshly extracted yet hardens with time, a behavior consistent with its long service life but also with observed deteriorations such as erosion, dissolution, black crust (gypsum) formation, granular disintegration, and biological colonization under humid, polluted urban atmospheres. We discuss weathering pathways, restoration outcomes, and risks posed by non-equivalent replacements. To sustain both material integrity and urban identity, the paper proposes identifying and qualifying new sources that match the original stone potentially in Türkiye (e.g. Çanakkale) and in abroad using standardized testing and performance-based acceptance criteria. Formal GHSR recognition would, in turn, support better sourcing, documentation, and conservation planning across Istanbul’s heritage assets."
  image: angi-2026-kufeki.jpg
  image_credit: "Şekil 1, CC BY 4.0"

- year: 2026
  date: "2026-01-20"
  title: "Assessment of a Weathering-Induced Rockfall Event and Development of Minimal-Intervention Mitigation Strategies in an Urban Environment"
  authors:
    - {n: "Ündül Ö.", m: true}
    - {n: "Nasery M.M."}
    - {n: "Doğu M.M.", m: true}
    - {n: "Zengin E.", m: true}
  source: "Applied Sciences Switzerland"
  type: Makale
  doi: "10.3390/app16021045"
  abstract: "The increase in population and demand for the various needs of citizens increases the interaction with the geo-environment. Thus, the rate of natural events affecting daily human life increases. Such an event occurred on a rock cliff in a densely populated area in İstanbul (Türkiye). More than four rock blocks (approximately 3–5 m<sup>3</sup>) belonging to the Paleozoic sequence of İstanbul, composed of nodular limestone with sandy-clay interlayers, detached and fell. The blocks traveled along a path of approximately 60 m and stopped by crushing a couple of buildings downslope. The path was rough and contained various surface conditions (e.g., bedrock, talus, and plants). This study was initiated by the examination of the dimensions of failed rock blocks, their paths, and topographic conditions. Unmanned vehicles (drones) facilitated the generation of 3D numerical models of topographic changes on the site. Quantifying discontinuity properties (such as persistence, spacing, roughness, etc.) and defining weathering properties comprises the second stage, along with sampling. Based on digital topographic data and field observations, cross-sections were defined by means of possible rockfall areas within the area of potentially unstable blocks. Numerical analysis and rockfall analysis were conducted along these critical sections. Interpretation of laboratory data and results obtained from numerical studies leads to an understanding of the mechanism of the recent rockfall event and demonstrates the most critical areas to be considered and reinforced. The research comprises proposing appropriate reinforcement techniques due to the strong Turkish regulations along the “Bosphorus Waterfront Protected Zone”. The study advises pre-cleaning of potentially unstable blocks after a fence production on paths where rocks could fall, and rock anchors in some localities with varying lengths. The latest part of the research covers the re-assessment of mitigation processes with numerical models, which shows that the factor of safety increased to the desired levels. The reinforcement applications at the site match well with the proposed prevention methods."
  image: undul-2026-kaya-dusmesi.jpg
  image_credit: "Şekil 20, CC BY 4.0"

- year: 2026
  date: "2026-01-14"
  title: "Bonded-particle modeling of sedimentary rocks: insights into model selection and mechanical response"
  authors:
    - {n: "Ündül Ö.", m: true}
    - {n: "Zengin E.", m: true}
  source: "Mediterranean Geoscience Reviews"
  type: Makale
  quartile: "(Q2 - Scopus)"
  doi: "10.1007/s42990-025-00214-1"
  abstract: "In rock mechanics and rock engineering, numerical methods are routinely employed to evaluate tunnel behavior in heterogeneous sedimentary rocks where variable strength and mixed-mode failure are common. To better understand the mechanical response of these rocks under tunnel stress conditions, three bonded-particle models—the Parallel-Bonded Model (PBM), Soft-Bonded Model (SBM), and Flat-Jointed Model (FJM)—were evaluated under different confinement levels using the Particle Flow Code (PFC). Laboratory test data on siltstone specimens from Istanbul, Türkiye, were used to calibrate the models, which were then subjected to triaxial loading at confining pressures of 1, 3, and 5 MPa before being upscaled to tunnel-scale analyses. Results indicate that PBM effectively captures brittle failure and localized shear bands; SBM yields lower strengths with diffuse cracking, typical of weak rock masses; and FJM reproduces mixed tensile–shear failure with ductile-like post-peak behavior. Rock behavior is strongly dependent on the selected contact model. The tunnel geometry served solely as a controlled testbed, and the results guide the selection of models for sedimentary rocks under confinement."

