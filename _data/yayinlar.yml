- year: 2026
  date: "2026-09-21"
  title: "Mineralogical characteristics of oxidized copper-porphyry ores at the Koktaszhal deposit"
  authors:
    - {n: "Toleubek K.E."}
    - {n: "Kopobayeva A.N."}
    - {n: "Amangeldikyzy A."}
    - {n: "Askarova N.S."}
    - {n: "Zengin E.", m: true}
    - {n: "Zhunusbekova G.Y."}
    - {n: "Mazakh B."}
    - {n: "Battalova A.S."}
  source: "Kompleksnoe Ispolzovanie Mineralnogo Syra"
  type: Makale
  quartile: "(Q2 - Scopus)"
  doi: "10.31643/2028/6445.26"
  abstract: "This paper presents the results of a comprehensive mineralogical study of oxidized copper-porphyry ore from the Koktashal deposit. Optical microscopy, silicate analysis, and quantitative phase analysis were used to characterize the mineral composition and forms of copper occurrence in the oxidation zone. The ore contains 0.735% total copper, of which 89.8% occurs in oxidized form, 6.39% in primary sulfides, 2.72% in secondary sulfides, and 1.09% in water-soluble form. The principal ore minerals are malachite (1.5–2.0%) and azurite (0.3–0.4%), accompanied by hematite with magnetite (0.5%), goethite (0.2%), and pyrite (0.2%), whereas copper sulfides and native copper occur only in trace amounts. The integration of classical mineralogical methods with quantitative phase analysis provides new insights into the distribution of copper occurrence forms and their relationship to oxidation processes. Malachite and azurite occur as well-crystallized vein and nest aggregates as well as colloform earthy masses developed along microcracks in association with iron hydroxides. Their close association with iron hydroxides and the near absence of copper sulfides represent a diagnostic feature of the oxidation zone in copper-porphyry systems. These findings improve the assessment of supergene alteration during exploration and support the classification of oxidation-zone ores as a distinct geological and industrial type for reserve estimation, ore body delineation, and processing scheme selection."

- year: 2026
  date: "2026-08-30"
  title: "Multi-Scale Characterization of Asphalt Aggregates: Linking Lithological Origin, Engineering Performance, and Stripping Resistance"
  authors:
    - {n: "Akgündüz A."}
    - {n: "Ündül Ö.", m: true}
    - {n: "Aksoy A."}
  source: "Applied Sciences Switzerland"
  type: Makale
  doi: "10.3390/app16178637"
  abstract: "Featured Application: The proposed lithology-based multi-scale framework can support asphalt aggregate selection by integrating mechanical durability, inferred binder–aggregate interaction potential, moisture susceptibility, stripping resistance, and hydrated lime response under different lithological conditions. This study investigates how lithological origin influences the engineering performance, stripping resistance, and multi-scale material characteristics of aggregates used in asphalt pavement applications. Three representative aggregate systems—carbonate limestone from Cebeci (Istanbul), siliciclastic sandstone from Arnavutköy (Istanbul), and mafic volcanic basalt from the Karatepe Formation (Çorlu, Tekirdağ)—were comparatively evaluated. The experimental program included physical and mechanical tests, X-ray diffraction, inductively coupled plasma optical emission spectroscopy, inductively coupled plasma mass spectrometry, thin-section petrography, and stripping resistance testing. Physical, mechanical, and durability test results were evaluated using replicate measurements and are reported as mean ± standard deviation where applicable. Basalt showed the best mechanical and durability performance, with the lowest flakiness index, Los Angeles abrasion value, and magnesium sulfate soundness loss, but exhibited the lowest unmodified retained coating. Limestone showed a higher inferred binder-affinity potential, interpreted from its calcite-dominated mineralogy, whereas sandstone displayed higher sensitivity related to particle shape, mineralogical heterogeneity, phyllosilicate-bearing components, and petrographic pore/microvoid characteristics. The addition of 0.5% CL 90 S hydrated lime produced an intermediate improvement in stripping resistance, increasing retained coating values to 75–80% for all aggregates, whereas 1.0% hydrated lime further improved retained coating to 80–85%. Higher lime contents of 1.5% and 2.0% did not provide additional improvement under the applied laboratory conditions. These results indicate that 1.0% CL 90 S hydrated lime represents the most effective dosage among the tested conditions. Overall, the results demonstrate that aggregate performance is governed by coupled lithological controls involving mineralogy, petrography, geochemistry, inferred surface-related interaction potential, mechanical durability, stripping resistance, and anti-stripping additive response. The proposed framework should therefore be interpreted as a comparative multi-scale assessment rather than a direct predictive model."
