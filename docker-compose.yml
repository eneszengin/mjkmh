# Yerel önizleme: docker compose up  ->  http://localhost:4000
services:
  jekyll:
    image: ruby:3.3
    working_dir: /srv/jekyll
    # production: jekyll serve'ün url'yi http://0.0.0.0:4000 yapmasını engeller; url _config_local.yml'den gelir
    command: sh -c "bundle install && bundle exec jekyll serve --config _config.yml,_config_local.yml --host 0.0.0.0 --livereload --force_polling"
    ports:
      - 4000:4000
      - 35729:35729
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle
    environment:
      - JEKYLL_ENV=production

volumes:
  bundle:
