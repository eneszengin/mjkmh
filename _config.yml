# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: "İstanbul Teknik Üniversitesi Maden Fakültesi Mühendislik Jeolojisi-Kaya Mekaniği-Hidrojeoloji (MJKMH) Çalışma Grubu"
email: your-email@domain.com
description: > # this means to ignore newlines until "baseurl:"
  İstanbul Teknik Üniversitesi Maden Fakültesi Mühendislik Jeolojisi-Kaya Mekaniği-Hidrojeoloji (MJKMH) Çalışma Grubu
baseurl: "/mjkmh" # geçici: eneszengin.github.io/mjkmh; mjkmh.itu.edu.tr bağlanınca "" olacak
url: ""

# Team sayfasında eğitim satırlarında bölüm adı gösterilsin mi
team_show_department: false

include:
  - .htaccess
  - _pages

# kisiler/: orijinal fotoğraflar (yalnızca yerelde); sitede images/kisiler/ kullanılır
exclude:
  - kisiler
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - LICENSE
  - README.md
  - vendor

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
